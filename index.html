<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meu Plantão</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22515%2077%20970%20970%22%3E%3Cdefs%3E%3Cmask%20id%3D%22m%22%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%222000%22%20height%3D%221200%22%20fill%3D%22%23000%22/%3E%3Ccircle%20cx%3D%221000%22%20cy%3D%22562%22%20r%3D%22481%22%20fill%3D%22%23fff%22/%3E%3Cpolyline%20points%3D%22380%2C872%20833%2C419%201420%2C1006%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%2292%22/%3E%3Cpath%20d%3D%22M1440%2C170%20C1230%2C265%201100%2C420%201125%2C565%20C1145%2C690%201265%2C800%201470%2C880%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%2292%22/%3E%3C/mask%3E%3C/defs%3E%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%222000%22%20height%3D%221200%22%20fill%3D%22%23091A35%22%20mask%3D%22url%28%23m%29%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=DM+Serif+Display:ital@1&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Paleta Almeida Carneiro: azul escuro #091A35, azul claro #7AA8D4, cinza #828282, branco #FFFFFF, preto #1D1D1F */
/* Layout: tela de entrada centralizada com a logo; depois, cabeçalho + abas + conteúdo (calendário e agenda lado a lado no computador, empilhados no celular) */
:root{
  --navy:#091A35; --sky:#7AA8D4; --onnavy:#ffffff;
  --bg:#f4f6f9; --surface:#ffffff; --fg:#1D1D1F; --muted:#6f6f72; --line:#e1e5eb; --soft:#edf3fa;
  --brand:#091A35; --accent:#091A35; --accent-fg:#ffffff; --hl:#7AA8D4; --hlbg:#e3eef8; --ok:#2e7d5b; --okbg:#dff0e8; --warn:#9a5b00; --warnbg:#fbefd9; --bad:#b0302b; --badbg:#f8e4e3;
  --c0:#2f5597;--t0:#e3ebf8;--c1:#4a4f57;--t1:#e8e9ec;--c2:#b0302b;--t2:#f8e4e3;--c3:#7a5a12;--t3:#f4ecd8;--c4:#2e7d5b;--t4:#dff0e8;--c5:#1d6f7a;--t5:#dcf0f2;--c6:#6a3fa0;--t6:#ece4f6;--c7:#a02f78;--t7:#f6e1ee;--c8:#b3541e;--t8:#f9e6da;--c9:#3c4f6b;--t9:#e4e9f0;--c10:#5b6b18;--t10:#edf0da;--c11:#8a3b3b;--t11:#f3e3e3;--c12:#3a47a8;--t12:#e3e6f7;--cx:#5b6678;--tx:#eef2f7;
  --display:"Outfit","Avenir Next",system-ui,sans-serif; --titulo:"DM Serif Display",Georgia,serif; --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#091A35; --surface:#0f2547; --fg:#ffffff; --muted:#a3b3c9; --line:#1e3864; --soft:#132d56;
  --brand:#ffffff; --accent:#7AA8D4; --accent-fg:#091A35; --hl:#7AA8D4; --hlbg:#1a3a68; --ok:#7fd0aa; --okbg:#1f3a30; --warn:#f0c27a; --warnbg:#3b3322; --bad:#f08c86; --badbg:#43262a;
  --c0:#8fb0ec;--t0:#22314f;--c1:#c3c8d1;--t1:#2b303a;--c2:#f08c86;--t2:#43262a;--c3:#e0c07a;--t3:#3b3322;--c4:#7fd0aa;--t4:#1f3a30;--c5:#72c9d4;--t5:#1b3539;--c6:#c0a2ea;--t6:#30264a;--c7:#ea92c9;--t7:#43243a;--c8:#f0a57a;--t8:#43291c;--c9:#a9b8cf;--t9:#283243;--c10:#c3d27a;--t10:#2f3520;--c11:#e0a3a3;--t11:#3d2626;--c12:#9fa9f0;--t12:#262b4a;--cx:#9aa6b8;--tx:#222a3a;
  color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
/* Símbolo da Almeida Carneiro como marca d'água fixa no fundo; todo o conteúdo fica por cima */
.marca{position:fixed;z-index:0;pointer-events:none;right:-18vmin;bottom:-22vmin;width:min(115vmin,1100px);color:var(--navy);opacity:.05}
.marca svg{display:block;width:100%;height:auto}
#root{position:relative;z-index:1}
body.modo-login{background:var(--navy)}
body.modo-login .marca{color:#ffffff;opacity:.06;right:auto;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(130vmin,1200px)}
@media (prefers-color-scheme: dark){.marca{color:#ffffff;opacity:.05}}
img{max-width:100%}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:grid;gap:18px}
.top{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:var(--navy);color:var(--onnavy);border-radius:12px;padding:10px 16px;min-height:56px}
.top .marca-nome{display:flex;align-items:center;gap:12px;min-width:0}
.top .logo{color:var(--onnavy);width:min(128px,34vw)}
.top .sep{width:1px;height:22px;background:rgba(255,255,255,.3)}
.top h1{font-family:var(--titulo);font-size:1.3rem;font-weight:400;font-style:italic;margin:0;color:var(--sky);white-space:nowrap;line-height:1}
.top .who{margin-left:auto;display:flex;gap:10px;align-items:center}
.top .pill{font-size:.75rem;padding:2px 9px}
.usermenu{position:relative}
.userbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--onnavy);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;font-weight:600;font-size:.9rem;max-width:46vw}
.userbtn:hover{background:rgba(255,255,255,.14)}
.userbtn .av{width:26px;height:26px;border-radius:50%;background:var(--sky);color:var(--navy);display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:none}
.userbtn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbtn svg{flex:none;opacity:.8;transition:transform .15s}
.userbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dropdown{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(9,26,53,.18);padding:6px;z-index:5}
.dropdown .info{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.dropdown .info b{display:block}
.dropdown .info span{font-size:.82rem;color:var(--muted)}
.dropdown button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer;font-weight:600}
.dropdown button:hover,.dropdown button:focus-visible{background:var(--soft)}
.dropdown button svg{width:16px;height:16px;flex:none;color:var(--muted)}
@media (max-width:560px){.top .pill{display:none}.top .sep{height:18px}.top h1{font-size:1.15rem}}
.wordmark{font-family:var(--display);font-weight:700;letter-spacing:.02em;color:var(--accent)}
.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;font-weight:700;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--soft);color:var(--muted)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{font:inherit;font-weight:600;font-size:.95rem;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted);padding:11px 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;border-radius:6px 6px 0 0}
.tab svg{width:16px;height:16px;flex:none;opacity:.75}
.tab:hover{color:var(--fg);background:var(--soft)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] svg{opacity:1}
.tab .n{font-variant-numeric:tabular-nums;font-weight:700;font-size:.72rem;background:var(--soft);color:var(--muted);border-radius:999px;padding:1px 7px}
.tab[aria-selected="true"] .n{background:var(--hlbg);color:var(--accent)}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font-weight:700;border-radius:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:8px 14px;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--accent)}
.btn.quiet{background:none;border-color:var(--line);color:var(--fg)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.lg{padding:11px 18px;font-size:1.05rem;width:100%}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-weight:600}
.why{font-size:.82rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.card h2{font-family:var(--display);font-size:1.2rem;margin:0}
.card p{margin:0;max-width:65ch}
.note-card{border-left:4px solid var(--hl)}
.note-card.warn{border-left-color:var(--warn)}
.err{color:var(--bad);font-weight:600}
/* entrada */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login-head .logo{color:var(--onnavy)}
.login-head h1{color:var(--onnavy)}
.login-head .divisor{display:block;width:44px;height:2px;background:var(--sky);border-radius:2px;margin:4px 0 10px}
.login-head .tagline{text-transform:uppercase;letter-spacing:.38em;font-size:.8rem;color:var(--sky);margin:2px 0 0;padding-left:.38em}
.login-head .local{color:#c9d6e6;font-size:.95rem;margin-top:6px}
.login .card{background:rgba(16,37,74,.72);border:1px solid rgba(122,168,212,.35);color:#fff;box-shadow:0 18px 40px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:24px 26px}
.login .card h2{font-family:var(--display);font-weight:400;font-size:1.4rem;color:#fff}
.login .card p,.login .card label,.login .card .lbl{color:#c9d6e6}
.login .card .note,.login .card .why{color:#a9bdd6}
.login .card .err{color:#f4a7a2}
.login .card input[type=text],.login .card input[type=email],.login .card input[type=password],.login .card select{background:rgba(9,26,53,.7);border-color:rgba(122,168,212,.35);color:#fff}
.login .card input::placeholder{color:#8fa3bd}
.login .card select option{color:#1D1D1F}
.login .btn{background:var(--sky);border-color:var(--sky);color:var(--navy)}
.login .btn.sec,.login .btn.quiet{background:transparent;color:var(--sky);border-color:var(--sky)}
.login .card .link{color:var(--sky)}
.login .card .stat{background:rgba(9,26,53,.6)}
.multi{position:relative;display:inline-block}
.multi-btn{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 32px 7px 11px;cursor:pointer;text-align:left;min-width:16ch;max-width:34ch;position:relative}
.multi-btn::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.multi-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(9,26,53,.25);padding:12px 14px;display:grid;gap:8px;min-width:240px}
.multi-pop .check{font-weight:600}
.simbolo-bv{width:92px;height:92px;color:var(--onnavy);margin-bottom:14px;animation:bvEntra .8s ease-out both}
.boasvindas h1{font-size:2.6rem!important;text-shadow:0 2px 12px rgba(0,0,0,.35);animation:bvEntra .8s .15s ease-out both}
.bv-nome{font-family:var(--display);font-size:1.6rem;font-weight:500;color:#fff;margin:4px 0 0;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.boasvindas .local{font-size:1.05rem;color:#e3ecf7}
.boasvindas .marca{opacity:.03}
.boasvindas .bv-nome,.boasvindas .local,.boasvindas .divisor{animation:bvEntra .8s .3s ease-out both}
@keyframes bvEntra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.simbolo-bv,.boasvindas *{animation:none!important}}
.proxmes{border:1px dashed var(--line);margin-top:8px;padding:12px 16px}
.pm-linha{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.pm-txt{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.pm-txt b{font-family:var(--display);font-size:1.1rem}
.proxmes.on{border:1px solid var(--ok);background:var(--okbg)}
.proxmes.on h2,.proxmes.on p{color:var(--fg)}
.orient{padding:12px 16px}
.orient h2{font-size:1rem}
.orient-corpo{display:grid;gap:4px}
.orient h3{font-family:var(--display);font-size:.92rem;margin:8px 0 0;color:var(--fg)}
.orient ul{margin:0;padding-left:18px;display:grid;gap:3px;color:var(--muted);font-size:.9rem}
.orient .fecho{margin:10px 0 0;font-style:italic;color:var(--fg);font-size:.9rem}
.liberar p{max-width:none}
.passo{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 16px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.passo-t{display:flex;align-items:center;gap:8px;font-weight:700}
.passo-n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:.75rem;flex:none}
.passo-c{min-width:0;display:grid;gap:6px}
.linha-imob{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.linha-imob .sw{background:var(--k)}
.avisos{display:grid;gap:4px;font-size:.85rem;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px}
@media (max-width:640px){.passo{grid-template-columns:1fr}}
.sep-login{border:0;border-top:1px solid rgba(122,168,212,.25);margin:6px 0 2px;width:100%}
.login-head p{color:var(--sky)}
.login .link{color:var(--sky)}
.login .card{box-shadow:0 10px 30px rgba(0,0,0,.25)}
.login-box{width:100%;max-width:400px;display:grid;gap:18px}
.login-head{display:grid;justify-items:center;gap:8px;text-align:center}
.login-head .logo{width:min(190px,60%);margin-bottom:6px}
.login-head h1{font-family:var(--titulo);font-size:3rem;line-height:1.05;font-weight:400;font-style:italic;letter-spacing:.01em;margin:4px 0 0}
.login-head p{margin:0}
.mesnav{display:flex;align-items:center;gap:10px}
.mesnav b{font-family:var(--display);font-size:1.25rem;min-width:9ch;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
.day{min-height:78px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.empty{background:var(--soft)}
.num{font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.day.has .num{color:var(--fg)}
.fer{color:var(--bad);font-size:.62rem;font-weight:700;margin-left:3px}
.tag{font:inherit;text-align:left;font-size:.72rem;font-weight:600;border-radius:4px;padding:2px 5px;background:var(--t);color:var(--k);border:0;border-left:3px solid var(--k);display:flex;flex-direction:column;line-height:1.2;min-width:0}
button.tag{cursor:pointer}
.tag .th{font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .tn{font-weight:500;font-size:.68rem;overflow-wrap:anywhere;color:var(--fg)}
.tag.st-futuro{background:var(--accent);color:var(--accent-fg);border-left-color:var(--accent)}
.tag.st-futuro .tn,.tag.st-feito .tn,.tag.st-agora .tn{color:inherit;font-weight:700}
.tag.st-agora{background:var(--sky);color:var(--navy);border-left-color:var(--sky)}
.tag.st-feito{background:var(--ok);color:var(--accent-fg);border-left-color:var(--ok)}
.tag.st-passado{background:var(--soft);color:var(--muted);border-left-color:var(--line)}
.tag.st-passado .tn{color:var(--muted)}
.item-st-feito{border-left:4px solid var(--ok)}
.item-st-agora{border-left:4px solid var(--sky)}
.item-st-futuro{border-left:4px solid var(--accent)}
.item-st-passado{border-left:4px solid var(--line);opacity:.75}
.legenda{gap:6px 14px;font-size:.8rem;color:var(--muted)}
.leg{display:inline-flex;align-items:center;gap:6px}
.leg-cor{width:12px;height:12px;border-radius:3px;display:inline-block}
.leg-cor.st-futuro{background:var(--accent)}.leg-cor.st-agora{background:var(--sky)}.leg-cor.st-feito{background:var(--ok)}.leg-cor.st-passado{background:var(--soft);border:1px solid var(--line)}
.tag.verde{background:var(--ok);color:var(--accent-fg);border-left-color:var(--ok);cursor:pointer}
.tag.verde .tn{color:var(--accent-fg);font-weight:700}
.tag.verde:hover{filter:brightness(1.1)}
.tag.sel{outline:3px solid var(--accent);outline-offset:1px}
.tag.livre{background:var(--surface);border:1.5px dashed var(--ok);color:var(--ok)}
.tag.mine{outline:2px solid var(--fg);outline-offset:-1px}
@media (max-width:480px){.day{min-height:60px;padding:3px}.tag{font-size:.6rem;padding:1px 3px}.tag .tn{font-size:.56rem}}
.list{display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:start}
.item.past{opacity:.6}
.date{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.date b{font-family:var(--display);font-size:1.5rem;line-height:1;display:block;font-variant-numeric:tabular-nums}
.date span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slots{display:grid;gap:6px;min-width:0}
.slot{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;padding:3px 0}
.slot + .slot{border-top:1px dashed var(--line);padding-top:7px}
.slot.trava{opacity:.6}
.slot .acts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nm{font-weight:700;color:var(--k)}
.hr{font-variant-numeric:tabular-nums;font-weight:600}
.loc{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--k)}
.free{font-weight:700;color:var(--ok)}
.note{font-size:.85rem;color:var(--muted)}
.vazio{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:22px 18px;display:grid;gap:4px;color:var(--muted)}
.vazio b{color:var(--fg);font-family:var(--display);font-size:1.1rem}

.chip{font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}

  if(c==="auth/network-request-failed")return "Sem conexão. Verifique a internet e tente de novo.";
  if(c==="auth/email-already-in-use")return "Este e-mail já tem um acesso no Meu Plantão. Use outro e-mail.";
  if(c==="auth/weak-password")return "A senha precisa ter pelo menos 6 caracteres.";
  if(c==="auth/invalid-email")return "Confira o e-mail digitado.";
  if(c==="auth/unauthorized-domain"||c==="auth/requests-from-referer-are-blocked")return "Este endereço ainda não foi autorizado no Firebase (Authentication → Configurações → Domínios autorizados).";
  if(c==="auth/configuration-not-found")return "O login ainda não foi ativado no Firebase (Authentication → Vamos começar → E-mail/senha).";
  if(c==="auth/operation-not-allowed")return "O login por e-mail ainda não foi ativado no Firebase (veja o passo 3 do LEIA-ME).";
  return "Não foi possível entrar agora. Tente de novo.";
}
async function run(fn,ok){if(ocupado)return;ocupado=true;render();try{await fn();if(ok)toast(ok)}catch(e){console.error(e);toast(e&&e.code&&String(e.code).startsWith("auth/")?authMsg(e):errMsg(e))}finally{ocupado=false;render()}}

/* ---------- partes da escala ---------- */

    if(desistirId===v.id)extra=`<div class="confirm danger"><span>Devolver este plantão para os outros corretores?</span><button class="btn sm danger" data-act="release" data-id="${v.id}" ${ocupado?"disabled":""}>Desistir do plantão</button><button class="btn sm quiet" data-act="cancel">Manter</button></div>`;

  return `<div class="slot ${o.pick&&!isL&&!mine?"trava":""}" id="s-${v.id}" style="${cores(p)}"><span class="sw"></span><span class="hr">${esc(v.ini)} às ${esc(v.fim)}</span>${who}${v.local?`<span class="loc">${esc(v.local)}</span>`:""}${v.obs?`<span class="note">${esc(v.obs)}</span>`:""}${isAdmin&&v.nota?`<span class="note">Nota: ${esc(v.nota)}</span>`:""}<span class="acts">${acts}</span>${extra}</div>`;

function agenda(lista,o){
  const dias=[...new Set(lista.map(v=>v.data))].sort();
  return dias.map(d=>`<article class="item ${d<hojeStr?"past":""}"><div class="date"><b>${pad(dnum(d))}</b><span>${DOW[dowOf(d)]}${o.showMes?`<br>${MESES[+d.slice(5,7)-1].slice(0,3)}`:""}</span></div><div class="slots">${lista.filter(v=>v.data===d).map(v=>slotLine(v,o)).join("")}</div></article>`).join("");
}
const mesNav=()=>`<div class="mesnav"><button class="iconbtn" data-act="mes" data-d="-1" aria-label="Mês anterior">‹</button><b>${nomeMes(mes)}</b><button class="iconbtn" data-act="mes" data-d="1" aria-label="Próximo mês">›</button></div>`;
function gradeDias(cell){
  const n=diasNoMes(mes),first=dowOf(mes+"-01");
  let h=`<div class="grid">${DOW.map(d=>`<div class="dow">${d}</div>`).join("")}`;
  for(let i=0;i<first;i++)h+=`<div class="day empty"></div>`;
  for(let d=1;d<=n;d++)h+=cell(`${mes}-${pad(d)}`,d);
  const rest=(7-((first+n)%7))%7;for(let i=0;i<rest;i++)h+=`<div class="day empty"></div>`;
  return h+`</div>`;
}
function calendario(lista,o={}){
  return `<section class="cal" aria-label="Calendário de ${nomeMes(mes)}">${gradeDias((ds,d)=>{
    const r=lista.filter(v=>v.data===ds);
    const tags=r.map(v=>{const isL=livre(v),mine=minha(v),p=parcDe(v);
      const est=o.estado&&mine?estadoPlantao(v):null;
      const nm=est?est.txt:isL?(isAdmin?"Livre":"Disponível"):(mine?"Seu plantão":(quem(v)||nomeParc(p)||"Reservado"));
      const clic=isAdmin?`data-act="edit" data-id="${v.id}"`:(isL&&!motivo(v)?`data-act="${o.escolher?"ask":"pickcal"}" data-id="${v.id}"`:"");
      const tg=clic?"button":"div";
      return `<${tg} class="tag ${isL?(isAdmin?"livre":"verde"):""} ${mine&&!est?"mine":""} ${est?est.cls:""} ${confirmId===v.id?"sel":""}" ${clic} style="${cores(p)}" title="${esc(nm)} · ${esc(v.ini)} às ${esc(v.fim)}"><span class="th">${esc(v.ini)}–${esc(v.fim)}</span><span class="tn">${esc(nm)}</span></${tg}>`}).join("");
    return `<div class="day ${r.length?"has":""}"><div class="num">${pad(d)}${ehFeriado(ds)?'<span class="fer">FERIADO</span>':""}</div>${tags}</div>`;
  })}</section>`;
}

const icsUTC=(d,h)=>{const dt=new Date(Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10),+h.slice(0,2)+3,+h.slice(3,5)));return dt.toISOString().replace(/[-:]/g,"").slice(0,15)+"Z"};
const icsTxt=t=>String(t||"").replace(/\\/g,"\\\\").replace(/[,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
function icsEvento(v){
  return ["BEGIN:VEVENT",`UID:${v.id}@meuplantao-almeidacarneiro`,`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,
    `DTSTART:${icsUTC(v.data,v.ini)}`,`DTEND:${icsUTC(v.data,v.fim)}`,
    `SUMMARY:${icsTxt("Plantão · Almeida Carneiro")}`,
    `LOCATION:${icsTxt("Stand de Vendas – Shopping Jequitibá"+(v.local?" ("+v.local+")":""))}`,
    `DESCRIPTION:${icsTxt(`Plantão das ${v.ini} às ${v.fim}.${v.obs?" "+v.obs:""} Meu Plantão: https://pollyanasilveira.github.io/meu-plantao/`)}`,
    "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-P1D",`DESCRIPTION:${icsTxt("Amanhã você tem plantão às "+v.ini)}`,"END:VALARM",
    "BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-PT2H",`DESCRIPTION:${icsTxt("Seu plantão começa às "+v.ini)}`,"END:VALARM",
    "END:VEVENT"].join("\r\n");
}
function baixarIcs(lista,nome){

// Situação visual de um plantão do corretor em "Meu calendário".
function estadoPlantao(v,agora=new Date()){
  if(tsData(v.checkin))return {cls:"st-feito",txt:"✓ Feito"};
  if(quando(v.data,v.fim)<agora)return {cls:"st-passado",txt:"Concluído"};
  if(quando(v.data,v.ini)<=agora)return {cls:"st-agora",txt:"Agora"};
  return {cls:"st-futuro",txt:"Seu plantão"};
}

// Formato: "## Título" abre um tema; "> texto" é a frase de fechamento; as outras linhas são tópicos.
const ORIENT_PADRAO=`## Maquete\nÉ proibido tocar na maquete. Oriente curiosos e crianças com educação, sem abrir exceção.\nA iluminação da maquete fica ligada somente no período noturno, para valorizar a exposição do empreendimento.\nO último plantonista do dia desliga a maquete e a tela interativa e guarda todo o material.\n## Registro de atendimento\nTodo atendimento no stand deve ser lançado no CVCRM, na mídia “Stand do Shopping”. Sem registro, não há atendimento para efeito de comissão e histórico.\n## Organização do espaço\nO stand é de uso coletivo: deixe-o limpo, organizado e pronto para o próximo colega.\nEm saídas rápidas, guarde os itens e desligue a tela interativa para evitar curiosos.\n## Vestimenta\nVocê representa a nossa marca. Use sua camiseta de Corretor Alto Padrão, ou use a paleta CAC: preto, azul e branco.\nUse sempre o crachá do CRECI.\n> Contamos com o profissionalismo de cada um. Bom plantão e boas vendas!`;
const orientacoes=()=>String(cfg.orientacoes??ORIENT_PADRAO).split("\n").map(x=>x.trim()).filter(Boolean);
function cardOrientacoes(){
  const it=orientacoes();if(!it.length)return "";
  let corpo="",aberta=false;
  const fecha=()=>{if(aberta){corpo+="</ul>";aberta=false}};
  for(const l of it){
    if(l.startsWith("## ")){fecha();corpo+=`<h3>${esc(l.slice(3))}</h3>`}
    else if(l.startsWith("> ")){fecha();corpo+=`<p class="fecho">${esc(l.slice(2))}</p>`}
    else{if(!aberta){corpo+="<ul>";aberta=true}corpo+=`<li>${esc(l)}</li>`}
  }
  fecha();
  return `<section class="card dobra-card orient" data-dobra="orient"><h2>Orientações do Plantão</h2><div class="orient-corpo">${corpo}</div></section>`;
}
let logoPngCache=null;

  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="515 77 970 970"><defs><mask id="m"><rect x="0" y="0" width="2000" height="1200" fill="#000"/><circle cx="1000" cy="562" r="481" fill="#fff"/><polyline points="380,872 833,419 1420,1006" fill="none" stroke="#000" stroke-width="92"/><path d="M1440,170 C1230,265 1100,420 1125,565 C1145,690 1265,800 1470,880" fill="none" stroke="#000" stroke-width="92"/></mask></defs><rect x="0" y="0" width="2000" height="1200" fill="#ffffff" mask="url(#m)"/></svg>';
  return new Promise(ok=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=600;c.height=600;c.getContext("2d").drawImage(img,0,0,600,600);logoPngCache=c.toDataURL("image/png");ok(logoPngCache)};img.onerror=()=>ok(null);img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)});

    headStyles:{fillColor:[9,26,53],textColor:255,fontStyle:"bold"},alternateRowStyles:{fillColor:[237,243,250]},
    didDrawPage:()=>{if(pdf.internal.getCurrentPageInfo().pageNumber>1)topo()}});
  const n=pdf.internal.getNumberOfPages(),H=pdf.internal.pageSize.getHeight(),agora=new Date();
  for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(130,130,130);
    pdf.text(`Gerado em ${pad(agora.getDate())}/${pad(agora.getMonth()+1)}/${agora.getFullYear()} às ${pad(agora.getHours())}:${pad(agora.getMinutes())}`,12,H-8);
    pdf.text(`Página ${i} de ${n}`,W-12,H-8,{align:"right"})}

/* ---------- ações ---------- */
function mudaMes(d){const dt=new Date(+mes.slice(0,4),+mes.slice(5,7)-1+d,1);mes=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}`;mesEscolhido=true;selDias.clear();editId=confirmId=libEdit=null}
function abrirLib(uid){libEdit=uid;const L=libDe(uid,mes);libDias=new Set((L&&L.dias)||[]);delete drafts["lb-lim"]}
async function tirarDaLib(b,v){if(!v.corretorId)return;const lr=doc(fs,"liberacoes",`${v.corretorId}_${v.mes}`);const s=await getDoc(lr);if(s.exists())b.update(lr,{escolhidas:arrayRemove(v.id)})}
async function act(a,ds){
  switch(a){
    case "modo":loginModo=ds.v;loginErr="";gestorNovo=false;pedindo=false;break;
    case "pedir":pedindo=ds.v==="1";loginErr="";break;
    case "gestornovo":gestorNovo=!gestorNovo;loginErr="";break;
    case "sair":menuAberto=false;await signOut(auth);return;
    case "menu":menuAberto=!menuAberto;break;
    case "tab":tab=ds.v;confirmId=desistirId=editId=libEdit=null;break;
    case "mes":mudaMes(+ds.d);break;
    case "ask":confirmId=ds.id;render();setTimeout(()=>document.querySelector(".confirm")?.scrollIntoView({block:"center",behavior:"smooth"}),50);return;
    case "pickcal":tab="escolher";confirmId=ds.id;render();setTimeout(()=>document.getElementById("s-"+ds.id)?.scrollIntoView({block:"center"}),60);return;
    case "cancel":confirmId=desistirId=null;break;
    case "askrel":desistirId=ds.id;break;
    case "passados":verPassados=!verPassados;break;
    case "sominhas":soMinhas=!soMinhas;break;
    case "claim":return claim(ds.id);
    case "release":desistirId=null;return release(ds.id);
    case "edit":editId=editId===ds.id?null:ds.id;delId=null;tab="escala";render();setTimeout(()=>document.getElementById("s-"+ds.id)?.scrollIntoView({block:"nearest"}),60);return;
    case "liberar":{const v=todas().find(x=>x.id===ds.id);return run(async()=>{const b=writeBatch(fs);b.update(doc(fs,"vagas",v.id),{corretorId:null,escolhidoEm:null,aberta:true,checkin:null,checkout:null});b.set(doc(fs,"privado",v.id),{nomeFixo:"",parceiro:""},{merge:true});await tirarDaLib(b,v);await b.commit()},"Horário liberado para escolha.")}
    case "askdel":delId=ds.id;break;
    case "nodel":delId=null;break;
    case "del":{const v={id:ds.id,...vagas.get(ds.id)};editId=delId=null;return run(async()=>{const b=writeBatch(fs);b.delete(doc(fs,"vagas",v.id));b.delete(doc(fs,"privado",v.id));await tirarDaLib(b,v);await b.commit()},"Horário excluído.")}
    case "toggle":return run(()=>updateDoc(doc(fs,"config","geral"),{aberta:!cfg.aberta}),cfg.aberta?"Escala fechada.":"Escala em aberto para os corretores.");
    case "dia":if(ds.d<hojeStr)return;selDias.has(ds.d)?selDias.delete(ds.d):selDias.add(ds.d);break;
    case "dias":selDias.clear();if(ds.q!=="nenhum")for(let d=1;d<=diasNoMes(mes);d++){const s=`${mes}-${pad(d)}`,w=dowOf(s);if(s<hojeStr)continue;if(ds.q==="todos"||(ds.q==="uteis"&&w>0&&w<6)||(ds.q==="fds"&&(w===0||w===6)))selDias.add(s)}break;
    case "turno":selTurnos.has(ds.t)?selTurnos.delete(ds.t):selTurnos.add(ds.t);break;
    case "asklimpar":limparLivres=true;break;
    case "nolimpar":limparLivres=false;break;
    case "limpar":{limparLivres=false;const ids=doMes(mes).filter(livre).map(v=>v.id);return run(async()=>{for(let i=0;i<ids.length;i+=200){const b=writeBatch(fs);ids.slice(i,i+200).forEach(id=>{b.delete(doc(fs,"vagas",id));b.delete(doc(fs,"privado",id))});await b.commit()}},`${ids.length} horários livres excluídos.`)}
    case "ajpadrao":{const vs=ajustePadrao();if(!vs.length)return;
      return run(async()=>{for(let i=0;i<vs.length;i+=400){const b=writeBatch(fs);vs.slice(i,i+400).forEach(v=>b.update(doc(fs,"vagas",v.id),regraGrupo(grupoDia(v.data))));await b.commit()}},`${vs.length} horários atualizados.`)}
    case "padrao":{const novos=planoPadrao();if(!novos.length)return;

// Cada corretor tem uma conta interna com senha aleatória (guardada só para o gestor).
// O login dele é o documento logins/<imobiliária--nome--ano>, que aponta para essa conta.
// Assim o gestor pode corrigir nome, imobiliária ou ano sem perder o histórico do corretor.
async function cadastrar(nome,k,ano,emLote,plantao=true){
  nome=String(nome||"").replace(/\s+/g," ").trim();ano=String(ano||"").trim();
  if(nome.length<2||!k)return "Preencha o nome e a imobiliária.";
  if(ano&&!anoOk(ano))return "Ano de nascimento inválido (use 4 números, ex.: 1990).";
  const key=chave(nome,k);
  if([...perfis.values()].some(p=>p.key===key))return "Já existe um corretor com esse nome nessa imobiliária.";
  if(!emLote){ocupado=true;render()}
  try{
    const email=`${slug(nome).slice(0,40)}.${Math.random().toString(36).slice(2,8)}@corretor.meuplantao.app`,pw=senhaAleatoria();
    const cred=await createUserWithEmailAndPassword(auth2,email,pw);
    const uid=cred.user.uid,b=writeBatch(fs);
    b.set(doc(fs,"credenciais",uid),{email,senha:pw});
    if(ano)b.set(doc(fs,"logins",loginId(key,ano)),{email,senha:pw,uid});
    b.set(doc(fs,"perfis",uid),{nome,parceiro:k,key,ano,inativos:[],...(plantao?{}:{plantao:false}),criadoEm:new Date().toISOString()});
    // Plantões já lançados com esse nome (ex.: escala de outubro) passam a ser deste corretor.
    todas().filter(v=>!v.corretorId&&v.nomeFixo&&(!v.parceiro||v.parceiro===k)&&casaNome(nome,v.nomeFixo)).forEach(v=>{b.update(doc(fs,"vagas",v.id),{corretorId:uid});b.set(doc(fs,"privado",v.id),{nomeFixo:""},{merge:true})});
    try{await b.commit()}catch(e){try{await cred.user.delete()}catch(x){} throw e}
    return "";
  }catch(e){console.error(e);return e.code==="permission-denied"?"O Firebase recusou a gravação. Publique as regras novas (firestore.rules) e tente de novo.":e.code&&e.code.startsWith("auth/")?authMsg(e):errMsg(e)}
  finally{try{await signOut(auth2)}catch(x){} if(!emLote){ocupado=false;render()}}
}
async function salvarCorretor(uid,nome,k,ano){
  nome=String(nome||"").replace(/\s+/g," ").trim();ano=String(ano||"").trim();
  if(nome.length<2||!k){toast("Preencha o nome e a imobiliária.");return false}
  if(ano&&!anoOk(ano)){toast("Ano de nascimento inválido (use 4 números, ex.: 1990).");return false}
  const p=perfis.get(uid),c=creds.get(uid),key=chave(nome,k);
  if([...perfis.entries()].some(([id,x])=>id!==uid&&x.key===key)){toast("Já existe outro corretor com esse nome nessa imobiliária.");return false}
  if(ano&&!c){toast("Não encontrei os dados internos deste corretor. Remova e cadastre de novo.");return false}
  let ok=false;
  await run(async()=>{const b=writeBatch(fs);
    if(p.ano)b.delete(doc(fs,"logins",loginId(p.key,p.ano)));
    if(ano)b.set(doc(fs,"logins",loginId(key,ano)),{email:c.email,senha:c.senha,uid});
    b.update(doc(fs,"perfis",uid),{nome,parceiro:k,key,ano});
    await b.commit();ok=true},"Cadastro atualizado.");
  return ok;
}
async function removerCorretor(uid){
  const p=perfis.get(uid);if(!p)return;

    // Os plantões dele continuam na escala com o nome, como lançamento do gestor.
    todas().filter(v=>v.corretorId===uid).forEach(v=>{b.update(doc(fs,"vagas",v.id),{corretorId:null,aberta:false});b.set(doc(fs,"privado",v.id),{nomeFixo:p.nome,parceiro:p.parceiro},{merge:true})});
    if(p.ano)b.delete(doc(fs,"logins",loginId(p.key,p.ano)));
    b.delete(doc(fs,"credenciais",uid));b.delete(doc(fs,"perfis",uid));
    await b.commit()},`${p.nome} removido(a). Os plantões dele(a) continuam na escala.`);
}

// Corretores cadastrados no formato antigo (login = imobiliária--nome, senha derivada do ano).
const antigos=()=>[...perfis.entries()].filter(([uid,p])=>p.ano&&!creds.has(uid));
async function converterAntigos(){
  const lista=antigos();if(!lista.length)return;
  return run(async()=>{let n=0;
    for(const [uid,p] of lista){
      const s=await getDoc(doc(fs,"logins",p.key));if(!s.exists())continue;
      const email=s.data().email,pw=`mp${p.ano}#${p.key}`,b=writeBatch(fs);

      b.delete(doc(fs,"logins",p.key));
      if(!p.inativos)b.update(doc(fs,"perfis",uid),{inativos:[]});
      await b.commit();n++;
    }
    if(n)toast(`Acesso de ${n} ${n===1?"corretor atualizado":"corretores atualizados"}. Eles entram normalmente com nome, imobiliária e ano.`);
  });

// Corretores que aparecem nas escalas (ex.: outubro) e ainda não têm cadastro.
function naEscalaSemCadastro(){
  const m=new Map();
  todas().filter(v=>!v.corretorId&&v.nomeFixo&&v.parceiro).forEach(v=>{const k=v.parceiro+"|"+norm(v.nomeFixo);
    if(![...perfis.values()].some(p=>p.parceiro===v.parceiro&&casaNome(p.nome,v.nomeFixo))&&!m.has(k))m.set(k,{nome:v.nomeFixo,k:v.parceiro})});
  return [...m.values()].sort((a,b)=>nomeParc(a.k).localeCompare(nomeParc(b.k))||a.nome.localeCompare(b.nome));
}
async function importarDaEscala(){
  const lista=naEscalaSemCadastro();if(!lista.length||ocupado)return;

  for(const x of lista){const r=await cadastrar(x.nome,x.k,"",true);if(r){erros.push(`${x.nome}: ${r}`);if(r.includes("recusou"))break}else ok++;render()}
  ocupado=false;importando=false;render();
  if(!ok&&erros.length){toast(erros[0].split(": ").slice(1).join(": "));return}
  toast(`${ok} ${ok===1?"corretor importado":"corretores importados"} da escala.${erros.length?` ${erros.length} com problema.`:""} Agora adicione o ano de nascimento de cada um.`);
  if(erros.length)console.warn(erros);

async function claim(id){
  if(ocupado)return;ocupado=true;render();
  const v0=vagas.get(id);
  try{
    await runTransaction(fs,async tx=>{
      const vr=doc(fs,"vagas",id),lr=doc(fs,"liberacoes",`${me.uid}_${v0.mes}`);
      const vs=await tx.get(vr),ls=await tx.get(lr);
      const fail=m=>{const e=new Error(m);e.amigavel=true;throw e};
      if(!vs.exists())fail("Este horário não existe mais.");
      const v={id,...vs.data()};
      if(!livre(v))fail("Este horário acabou de ser escolhido por outra pessoa. Escolha outro.");
      if(!ls.exists())fail("Este dia não está liberado para você.");
      const L=ls.data(),esc_=L.escolhidas||[];
      if(!(L.dias||[]).includes(v.data))fail("Este dia não está liberado para você.");
      if(esc_.length>=L.limite)fail(`Você já escolheu ${L.limite} ${L.limite===1?"plantão":"plantões"} neste mês.`);
      tx.update(vr,{corretorId:me.uid,escolhidoEm:new Date().toISOString()});
      tx.update(lr,{escolhidas:[...esc_,id]});
    });
    confirmId=null;toast(`Plantão confirmado: ${ddmm(v0.data)}, ${v0.ini} às ${v0.fim}.`);
  }catch(e){confirmId=null;toast(e.amigavel?e.message:errMsg(e))}finally{ocupado=false;render()}
}
async function release(id){
  const v0=vagas.get(id);
  return run(()=>runTransaction(fs,async tx=>{
    const vr=doc(fs,"vagas",id),lr=doc(fs,"liberacoes",`${me.uid}_${v0.mes}`);
    const ls=await tx.get(lr);
    tx.update(vr,{corretorId:null,escolhidoEm:null});
    if(ls.exists())tx.update(lr,{escolhidas:(ls.data().escolhidas||[]).filter(x=>x!==id)});

}

      const s=await getDoc(doc(fs,"logins",loginId(key,ano)));
      if(s.exists()){iniciarSplash();await signInWithEmailAndPassword(auth,s.data().email,s.data().senha);return}
      // Cadastros feitos antes da mudança de formato (login = imobiliária--nome, senha derivada do ano).
      const velho=await getDoc(doc(fs,"logins",key));
      if(velho.exists()){iniciarSplash();await signInWithEmailAndPassword(auth,velho.data().email,`mp${ano}#${key}`);return}
      loginErr="Não encontramos um cadastro com esse nome, imobiliária e ano de nascimento. Confira os dados ou fale com a coordenação.";
    }catch(e){splashAte=0;loginErr=authMsg(e)}finally{ocupado=false;render()}
  }
  else if(f==="solicitar"){
    const nome=g("sl-nome"),k=g("sl-imob"),email=g("sl-email").toLowerCase(),pw=document.getElementById("sl-senha").value;loginErr="";
    if(!nome||!k||!email){loginErr="Preencha nome, imobiliária e e-mail.";render();return}
    ocupado=true;cadastrando=true;render();let cred=null;
    try{cred=await createUserWithEmailAndPassword(auth,email,pw);
      await setDoc(doc(fs,"solicitacoes",cred.user.uid),{nome,email,imob:k,criadoEm:new Date().toISOString()});pedindo=false}
    catch(e){if(cred){try{await cred.user.delete()}catch(x){await signOut(auth)}}loginErr=e.code&&String(e.code).startsWith("auth/")?authMsg(e):errMsg(e)}
    finally{cadastrando=false;ocupado=false;if(auth.currentUser)iniciar(auth.currentUser);else render()}}
  else if(f==="gestor"){
    const email=g("gs-email"),pw=document.getElementById("gs-senha").value;loginErr="";ocupado=true;render();
    if(!gestorNovo){try{iniciarSplash();await signInWithEmailAndPassword(auth,email,pw)}catch(e){splashAte=0;loginErr=authMsg(e)}finally{ocupado=false;render()}return}
    cadastrando=true;let cred=null;
    try{
      cred=await createUserWithEmailAndPassword(auth,email,pw);
      const b=writeBatch(fs);
      b.set(doc(fs,"admins",cred.user.uid),{email,criadoEm:new Date().toISOString()});
      b.set(doc(fs,"config","geral"),DEF_CFG);
      b.set(doc(fs,"publico","imobiliarias"),{lista:DEF_PARC});
      await b.commit();
    }catch(e){
      if(cred){try{await cred.user.delete()}catch(x){await signOut(auth)}}
      loginErr=e.code==="permission-denied"?"O sistema já tem um gestor. Entre com o acesso de gestor existente.":authMsg(e);
    }finally{cadastrando=false;ocupado=false;if(auth.currentUser)iniciar(auth.currentUser);else render()}
  }
  else if(f==="editcor"){const uid=form.dataset.uid;
    if(await salvarCorretor(uid,g("ec-nome"),g("ec-imob"),g("ec-ano"))){editCor=null;["ec-nome","ec-imob","ec-ano"].forEach(k=>delete drafts[k]);render()}}
  else if(f==="novo"){
    const r=await cadastrar(g("nc-nome"),g("nc-imob"),g("nc-ano"),false,g("nc-plantao"));
    if(r){toast(r);return}
    toast("Corretor cadastrado.");["nc-nome","nc-ano"].forEach(k=>delete drafts[k]);render()}
  else if(f==="lote"){
    const linhas=g("nc-lote").split(/\n/).map(x=>x.trim()).filter(Boolean);
    if(!linhas.length)return;
    ocupado=true;lote={msg:`Cadastrando 0 de ${linhas.length}…`,erros:[]};render();
    let ok=0;const erros=[],sobra=[];
    for(const [i,l] of linhas.entries()){
      const [nome="",im="",ano="",pl=""]=l.split(/[;\t]/).map(x=>x.trim());
      const k=(imobs.find(x=>norm(x.nome)===norm(im)||x.k===slug(im))||{}).k;
      const r=k?await cadastrar(nome,k,ano,true,!/^n(ao|ão|o)?$/i.test(pl)):`Imobiliária “${im}” não encontrada`;
      if(r){erros.push(`${l} → ${r}`);sobra.push(l)}else ok++;
      lote.msg=`Cadastrando ${i+1} de ${linhas.length}…`;render();
    }
    ocupado=false;drafts["nc-lote"]=sobra.join("\n");
    lote={msg:`${ok} ${ok===1?"corretor cadastrado":"corretores cadastrados"}.${erros.length?` ${erros.length} com problema (ficaram na caixa para corrigir):`:""}`,erros};render()}
  else if(f==="ajci"){const id=form.dataset.id,v=todas().find(x=>x.id===id),a=g("aj-in"),b=g("aj-out");
    if(!a){toast("Informe o horário de entrada.");return}
    if(b&&mins(b)<=mins(a)){toast("A saída precisa ser depois da entrada.");return}
    const ts=h=>Timestamp.fromDate(quando(v.data,h)),quemAj=me.email||"coordenação";
    await run(()=>updateDoc(doc(fs,"vagas",id),{checkin:{em:ts(a),dist:null,prec:null,manual:true,por:quemAj},checkout:b?{em:ts(b),dist:null,prec:null,manual:true,por:quemAj}:null}),"Check-in ajustado.");
    ajusteCi=null;delete drafts["aj-in"];delete drafts["aj-out"];render()}
  else if(f==="orient"){const t=document.getElementById("or-txt").value.split("\n").map(x=>x.trim()).filter(Boolean).join("\n");
    await run(()=>updateDoc(doc(fs,"config","geral"),{orientacoes:t}),"Orientações salvas.");delete drafts["or-txt"];render()}
  else if(f==="stand"){const c=g("sd-coord").split(/[,;\s]+/).filter(Boolean).map(Number),raio=Math.max(30,parseInt(g("sd-raio"))||150),tol=Math.max(0,parseInt(g("sd-tol"))||0);
    let stand=cfg.stand||null;
    if(c.length===2&&c.every(x=>isFinite(x))&&Math.abs(c[0])<=90&&Math.abs(c[1])<=180)stand={lat:c[0],lng:c[1],raio};
    else if(g("sd-coord")){toast("Coordenadas inválidas. Use o formato: -14.79, -39.27");return}
    else if(stand)stand={...stand,raio};
    await run(()=>updateDoc(doc(fs,"config","geral"),{...(stand?{stand}:{}),tolerancia:tol}),"Local do stand salvo.");["sd-coord","sd-raio","sd-tol"].forEach(k=>delete drafts[k]);render()}
  else if(f==="novogest"){if(await cadastrarGestor(g("ng-nome"),g("ng-email"),g("ng-imob"))){["ng-nome","ng-email","ng-imob"].forEach(k=>delete drafts[k]);render()}}
  else if(f==="cfg"){
    const fer=g("cf-fer").split(/[,;\s]+/).filter(Boolean).map(s=>{const m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?$/);return m?`${m[3]||mes.slice(0,4)}-${pad(+m[2])}-${pad(+m[1])}`:null}).filter(Boolean);
    await run(()=>updateDoc(doc(fs,"config","geral"),{desistir:g("cf-des"),aviso:g("cf-av"),feriados:fer}),"Ajustes salvos.");["cf-des","cf-av","cf-fer"].forEach(k=>delete drafts[k]);render()}
  else if(f==="turno"){const a=g("nt-ini"),b=g("nt-fim");if(!a||!b||mins(b)<=mins(a)){toast("Informe um início e um fim depois do início.");return}
    const t=`${a}-${b}`;if(!turnosExtra.includes(t))turnosExtra.push(t);selTurnos.add(t);delete drafts["nt-ini"];delete drafts["nt-fim"];render()}
  else if(f==="criar"){const parceiro=nvModo==="uma"?g("nv-parc"):"",local=g("nv-local"),obs=g("nv-obs");
    if(nvModo==="uma"&&!parceiro){toast("Escolha a imobiliária.");return}
    const excI=nvModo==="exceto"?[...exc.nv.imob]:[],excC=nvModo==="exceto"?[...exc.nv.cor].filter(id=>!excI.includes(perfis.get(id)?.parceiro)):[];
    if(nvModo==="exceto"&&!excI.length&&!excC.length){toast("Marque quem fica de fora, ou escolha “Todas as imobiliárias”.");return}
    const novos=[];[...selDias].sort().forEach(d=>[...selTurnos].sort().forEach(t=>{const [ini,fim]=t.split("-");if(!todas().some(v=>v.data===d&&v.ini===ini&&v.fim===fim&&(v.restrito||"")===parceiro))novos.push({mes:d.slice(0,7),data:d,ini,fim,restrito:parceiro,excetoImob:excI,excetoCor:excC,local,obs,aberta:true,corretorId:null,escolhidoEm:null})}));
    if(!novos.length){toast("Esses horários já existem.");return}
    await run(async()=>{for(let i=0;i<novos.length;i+=400){const b=writeBatch(fs);novos.slice(i,i+400).forEach(v=>b.set(doc(collection(fs,"vagas")),v));await b.commit()}},`${novos.length} horários criados. Agora libere os dias para cada corretor.`);selDias.clear();render()}
  else if(f==="edit"){const id=form.dataset.id,k=x=>g(`e-${x}-${id}`);const ini=k("ini"),fim=k("fim");if(!ini||!fim||mins(fim)<=mins(ini)){toast("O fim precisa ser depois do início.");return}
    const cid=k("cid"),nome=k("nome"),v=todas().find(x=>x.id===id);
    await run(async()=>{const b=writeBatch(fs);
      if(v.corretorId&&v.corretorId!==cid)await tirarDaLib(b,v);
      b.update(doc(fs,"vagas",id),{corretorId:cid||null,restrito:k("restr"),ini,fim,local:k("local"),obs:k("obs"),aberta:!cid&&!nome?(v.aberta??true):false});
      b.set(doc(fs,"privado",id),{nomeFixo:cid?"":nome,parceiro:cid?"":k("parc"),nota:k("nota")},{merge:true});
      await b.commit()},"Horário atualizado.");
    Object.keys(drafts).filter(x=>x.endsWith("-"+id)).forEach(x=>delete drafts[x]);editId=null;render()}
  else if(f==="lib"){const uid=form.dataset.uid,lim=parseInt(g("lb-lim"))||0;
    if(!libDias.size){toast("Marque pelo menos um dia, ou use “Remover liberação”.");return}
    if(lim<1){toast("O limite precisa ser de pelo menos 1 plantão.");return}
    const L=libDe(uid,mes);
    await run(async()=>{const ref=doc(fs,"liberacoes",`${uid}_${mes}`);const b=writeBatch(fs);
      if(L)b.update(ref,{dias:[...libDias].sort(),limite:lim});else b.set(ref,{uid,mes,dias:[...libDias].sort(),limite:lim,escolhidas:[]});
      // Se algum horário livre desses dias estava reservado para outra imobiliária ou excluía este corretor, abre para ele também.
      const pk=perfis.get(uid)?.parceiro;
      doMes(mes).filter(v=>libDias.has(v.data)&&livre(v)&&((v.restrito&&v.restrito!==pk)||(v.excetoImob||[]).includes(pk)||(v.excetoCor||[]).includes(uid))).forEach(v=>{
        const exI=(v.restrito?imobs.map(x=>x.k).filter(k=>k!==v.restrito):[...(v.excetoImob||[])]).filter(k=>k!==pk);
        b.update(doc(fs,"vagas",v.id),{restrito:"",excetoImob:exI,excetoCor:(v.excetoCor||[]).filter(u=>u!==uid)})});
      await b.commit()},`Dias liberados para ${perfis.get(uid)?.nome||"o corretor"}.`);
    libEdit=null;render()}
  else if(f==="renparc"){const k=form.dataset.k,nome=g("rn-nome");if(!nome){toast("Digite o nome da imobiliária.");return}
    if(imobs.some(x=>x.k!==k&&norm(x.nome)===norm(nome))){toast("Já existe uma imobiliária com esse nome.");return}
    await run(()=>updateDoc(doc(fs,"publico","imobiliarias"),{lista:imobs.map(x=>x.k===k?{...x,nome}:x)}),`Imobiliária renomeada para ${nome}.`);editImob=null;delete drafts["rn-nome"];render()}
  else if(f==="parc"){const nome=g("np-nome");if(!nome)return;const base=slug(nome)||"imobiliaria";let k=base,i=2;while(parc(k))k=base+"-"+i++;
    const usadas=imobs.map(p=>p.cor);let cor=[...Array(13).keys()].find(c=>!usadas.includes(c));if(cor===undefined)cor=imobs.length%13;
    await run(()=>updateDoc(doc(fs,"publico","imobiliarias"),{lista:[...imobs,{k,nome,cor}]}),`${nome} adicionada.`);delete drafts["np-nome"];render()}
}
document.addEventListener("click",e=>{
  const hd=e.target.closest(".dobra-card>:first-child");
  if(hd&&!e.target.closest("[data-act],button,input,select,textarea,label,a")){const c=hd.parentElement,k=c.dataset.dobra;
    c.classList.toggle("fechado");c.classList.contains("fechado")?abertos.delete(k):abertos.add(k);
    try{localStorage.setItem("mp-abertos",JSON.stringify([...abertos]))}catch(x){}return}
  if(hpAberto&&!e.target.closest(".multi")){hpAberto=null;render()}
  const b=e.target.closest("[data-act]");
  if(menuAberto&&(!b||b.dataset.act!=="menu")&&!e.target.closest(".dropdown")){menuAberto=false;if(!b){render();return}}
  if(!b)return;e.preventDefault();act(b.dataset.act,b.dataset)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&menuAberto){menuAberto=false;render()}});
document.addEventListener("submit",e=>{e.preventDefault();submit(e.target)});
const keep=e=>{const t=e.target;if(t.id&&t.type!=="password")drafts[t.id]=t.type==="checkbox"?t.checked:t.value;
  if(e.type==="change"&&t.id&&t.id.startsWith("rel-")){if(t.id==="rel-tipo")relTipo=t.value;if(t.id==="rel-imob"){relImob=t.value;relCor=""}if(t.id==="rel-cor")relCor=t.value;render()}
  if(e.type==="change"&&t.id==="nv-modo"){nvModo=t.value;render()}
  if(e.type==="change"&&t.id&&t.id.startsWith("dist-")){delete drafts[t.id];atribuirVaga(t.id.slice(5),t.value)}
  if(e.type==="change"&&t.id&&t.id.startsWith("hp-q-")){hpQuem[t.id.slice(5)]=t.value;try{localStorage.setItem("mp-hpQuem",JSON.stringify(hpQuem))}catch(x){}render()}
  if(e.type==="change"&&["hp-meses","lb-imob","lb-excl"].includes(t.id)){if(t.id==="hp-meses")hpMeses=t.value;if(t.id==="lb-imob")lbImob=t.value;if(t.id==="lb-excl")lbExcl=t.checked;render()}};
document.addEventListener("input",keep);document.addEventListener("change",keep);

/* ---------- dados ---------- */
function parar(){subs.forEach(f=>f());subs=[];libsImob=new Map();vagas=new Map();privs=new Map();creds=new Map();perfis=new Map();libs=new Map()}
const falha=e=>{console.error(e);if(e.code!=="permission-denied")toast("A conexão com a escala caiu. Recarregue a página.")};
async function iniciar(u){
  parar();me=u;isAdmin=false;isGestor=false;gImob="";perfil=null;fase="carregando";render();
  try{
    const a=await getDoc(doc(fs,"admins",u.uid));isAdmin=a.exists();
    if(!isAdmin){const gi=await getDoc(doc(fs,"gestoresImob",u.uid));if(gi.exists()){isGestor=true;gImob=gi.data().imob}}
    if(!isAdmin&&!isGestor){const p=await getDoc(doc(fs,"perfis",u.uid));perfil=p.exists()?p.data():null}
  }catch(e){console.error(e)}
  if(!isAdmin&&!isGestor&&!perfil){
    try{const sp=await getDoc(doc(fs,"solicitacoes",u.uid));if(sp.exists()){pedido=sp.data();fase="pendente";render();
      // quando a coordenação aprovar, entra sozinho
      subs.push(onSnapshot(doc(fs,"gestoresImob",u.uid),s=>{if(s.exists())iniciar(u)},()=>{}));return}}catch(e){}
    fase="semperfil";render();return}
  subs.push(onSnapshot(doc(fs,"config","geral"),s=>{cfg={...DEF_CFG,...(s.exists()?s.data():{})};render()},falha));
  subs.push(onSnapshot(collection(fs,"vagas"),s=>{
    vagas=new Map(s.docs.map(d=>[d.id,d.data()]));
    if(confirmId&&!ocupado){const v=vagas.get(confirmId);if(!v||(!livre(v)&&v.corretorId!==me.uid)){confirmId=null;toast("Outro corretor acabou de preencher esse horário. Escolha outro.")}}
    if(!mesEscolhido&&!s.metadata.fromCache){mesEscolhido=true;const ms=[...new Set(s.docs.map(d=>d.data().mes).filter(Boolean))].sort();if(ms.length&&!ms.includes(mes))mes=ms.find(m=>m>=mes)||ms[ms.length-1]}
    render()},falha));
  if(isAdmin){
    subs.push(onSnapshot(collection(fs,"credenciais"),s=>{creds=new Map(s.docs.map(d=>[d.id,d.data()]))},falha));
    subs.push(onSnapshot(collection(fs,"privado"),s=>{privs=new Map(s.docs.map(d=>[d.id,d.data()]));render()},falha));
    subs.push(onSnapshot(collection(fs,"perfis"),s=>{perfis=new Map(s.docs.map(d=>[d.id,d.data()]));render()},falha));
    subs.push(onSnapshot(collection(fs,"liberacoes"),s=>{libs=new Map(s.docs.map(d=>[d.id,d.data()]));render()},falha));
    subs.push(onSnapshot(collection(fs,"gestoresImob"),s=>{gestores=new Map(s.docs.map(d=>[d.id,d.data()]));render()},falha));
    subs.push(onSnapshot(collection(fs,"liberacoesImob"),s=>{libsImob=new Map(s.docs.map(d=>[d.id,d.data()]));render()},falha));
    subs.push(onSnapshot(collection(fs,"solicitacoes"),s=>{solicitacoes=new Map(s.docs.map(d=>[d.id,d.data()]));render()},falha));
  }else if(isGestor){
    subs.push(onSnapshot(query(collection(fs,"liberacoesImob"),where("imob","==",gImob)),s=>{libsImob=new Map(s.docs.map(d=>[d.id,d.data()]));render()},falha));
    subs.push(onSnapshot(query(collection(fs,"perfis"),where("parceiro","==",gImob)),s=>{perfis=new Map(s.docs.map(d=>[d.id,d.data()]));render()},falha));
  }else{
    subs.push(onSnapshot(doc(fs,"perfis",u.uid),s=>{if(s.exists()){perfil=s.data();render()}else signOut(auth)},falha));
    subs.push(onSnapshot(query(collection(fs,"liberacoes"),where("uid","==",u.uid)),s=>{libs=new Map(s.docs.map(d=>[d.id,d.data()]));render()},falha));
  }
  tab=isAdmin?"escala":isGestor?"distribuir":"minhas";
  fase="ok";render();
}
setInterval(()=>{if(fase==="ok"&&tab==="checkin"&&!ocupado&&!(document.activeElement&&document.activeElement.id))render()},60000);
if(configurado){
  onSnapshot(doc(fs,"publico","imobiliarias"),s=>{imobs=s.exists()?(s.data().lista||[]):[];render()},e=>console.error(e));
  onSnapshot(doc(fs,"publico","distribui"),s=>{distribui=new Set(s.exists()?(s.data().imobs||[]):[]);render()},e=>console.error(e));
  onAuthStateChanged(auth,u=>{
    if(cadastrando)return;
    if(!u){loginModo="escolha";parar();me=null;isAdmin=false;isGestor=false;gImob="";perfil=null;fase="login";render();return}
    iniciar(u);
  });
}else render();
</script>
